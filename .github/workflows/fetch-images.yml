# One-off helper: downloads the site photos listed in .github/image-sources.txt,
# resizes them to web-friendly JPEGs and commits them to klandermuelen/img/.
name: Fetch site images
on:
  push:
    paths: ['.github/image-sources.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - name: Download and convert
        run: |
          mkdir -p klandermuelen/img
          python - <<'PY'
          import io, urllib.request
          from PIL import Image
          for line in open('.github/image-sources.txt'):
              if not line.strip(): continue
              name, width, url = line.split()
              data = urllib.request.urlopen(url, timeout=60).read()
              im = Image.open(io.BytesIO(data)).convert('RGB')
              w = int(width)
              if im.width > w:
                  im = im.resize((w, round(im.height * w / im.width)), Image.LANCZOS)
              im.save(f'klandermuelen/img/{name}.jpg', 'JPEG', quality=80, optimize=True, progressive=True)
              print(name, im.size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add klandermuelen/img
          git diff --cached --quiet || git commit -m "Add site photos"
          git push
